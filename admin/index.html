<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмінка товарів | Ukrainian Print Family</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/images/photo_2025-09-24_14-16-02.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="tail-container admin-page bg-white text-slate-900 min-h-screen">
    <main class="max-w-4xl mx-auto px-4 sm:px-6 py-8 sm:py-10">
        <div class="mb-6 flex items-center justify-between gap-3">
            <h1 class="text-2xl sm:text-3xl font-bold section-title">Адмінка товарів</h1>
            <a href="/index.html#products" class="liquid-glass-btn px-4 py-2 rounded-xl text-sm font-semibold inline-flex items-center gap-2">
                <i class="fa-solid fa-store"></i>
                Каталог
            </a>
        </div>

        <section class="preview-detail-card p-4 sm:p-5 mb-5">
            <form id="admin-auth-form" class="space-y-3">
                <label for="admin-password" class="text-sm font-semibold">Пароль адмінки</label>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input id="admin-password" type="password" autocomplete="current-password" class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-slate-900 text-white focus:outline-none focus:border-blue-700" placeholder="Введіть пароль" required>
                    <button type="submit" id="admin-auth-btn" class="liquid-glass-btn px-5 py-3 rounded-xl font-semibold whitespace-nowrap">Увійти</button>
                </div>
                <p id="admin-auth-status" class="text-sm text-slate-400">Доступ до додавання товарів закритий.</p>
            </form>
        </section>

        <section id="admin-form-section" class="preview-detail-card p-4 sm:p-5 hidden">
            <h2 class="text-lg font-semibold mb-4">Додати товар</h2>
            <form id="admin-product-form" class="space-y-4">
                <div class="grid sm:grid-cols-2 gap-4">
                    <div>
                        <label for="product-category" class="text-sm font-medium block mb-1">Категорія</label>
                        <select id="product-category" class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-slate-900 text-white focus:outline-none focus:border-blue-700"></select>
                    </div>
                    <div>
                        <label for="product-subcategory" class="text-sm font-medium block mb-1">Підкатегорія / підпис</label>
                        <select id="product-subcategory" class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-slate-900 text-white focus:outline-none focus:border-blue-700"></select>
                    </div>
                </div>
                <div>
                    <label for="product-title" class="text-sm font-medium block mb-1">Назва</label>
                    <input id="product-title" type="text" class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-slate-900 text-white focus:outline-none focus:border-blue-700" placeholder="Футболка з принтом «... »" required>
                </div>
                <div>
                    <label for="product-price" class="text-sm font-medium block mb-1">Ціна (грн)</label>
                    <input id="product-price" type="number" min="1" step="1" class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-slate-900 text-white focus:outline-none focus:border-blue-700" placeholder="650" required>
                </div>
                <div>
                    <label for="product-image-file" class="text-sm font-medium block mb-1">Зображення (завантаження у Supabase Storage)</label>
                    <input id="product-image-file" type="file" accept="image/*" class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-slate-900 text-white focus:outline-none focus:border-blue-700">
                    <p class="text-xs text-slate-500 mt-1">Рекомендовано: JPG/PNG/WEBP до 12MB.</p>
                </div>
                <div>
                    <label for="product-image" class="text-sm font-medium block mb-1">Або вставте шлях/URL (необовʼязково)</label>
                    <input id="product-image" type="text" class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-slate-900 text-white focus:outline-none focus:border-blue-700" placeholder="images/назва.jpg або https://...">
                </div>
                <div id="product-image-preview-wrap" class="hidden">
                    <p class="text-sm font-medium mb-2">Превʼю зображення</p>
                    <div class="w-40 h-40 rounded-xl border border-slate-300 overflow-hidden bg-slate-900">
                        <img id="product-image-preview" src="" alt="Превʼю" class="w-full h-full object-cover">
                    </div>
                </div>
                <div>
                    <label for="product-description" class="text-sm font-medium block mb-1">Опис</label>
                    <textarea id="product-description" rows="4" class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-slate-900 text-white focus:outline-none focus:border-blue-700 resize-y" placeholder="Короткий опис товару"></textarea>
                </div>
                <button type="submit" id="admin-submit-btn" class="liquid-glass-btn px-6 py-3 rounded-xl font-semibold inline-flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i>
                    Додати товар
                </button>
            </form>
            <p id="admin-submit-status" class="text-sm text-slate-400 mt-3">Після додавання товар автоматично зʼявиться в каталозі після оновлення сторінки.</p>
        </section>

        <section class="preview-detail-card p-4 sm:p-5 mt-5">
            <div class="flex items-center justify-between gap-3 mb-4">
                <h2 class="text-lg font-semibold">Товари з бази</h2>
                <button id="admin-refresh-btn" type="button" class="liquid-glass-btn px-4 py-2 rounded-xl text-sm font-semibold inline-flex items-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i>
                    Оновити
                </button>
            </div>
            <div id="admin-products-list" class="space-y-3"></div>
        </section>
    </main>

    <script src="/js/ui-helpers.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
