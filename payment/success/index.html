<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплату отримано | Ukrainian Print Family</title>
    <style>
        :root {
            color-scheme: dark;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Manrope, Arial, sans-serif;
            background: radial-gradient(circle at 20% 15%, #1d4ed8 0%, #071126 42%, #04070f 100%);
            color: #e2e8f0;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .card {
            width: min(560px, 100%);
            border: 1px solid #36527e;
            border-radius: 20px;
            background: rgba(6, 15, 31, 0.88);
            box-shadow: 0 18px 46px rgba(2, 6, 23, 0.58);
            padding: 24px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 1.6rem;
        }
        p {
            margin: 0 0 14px;
            color: #c6d2e6;
            line-height: 1.45;
        }
        .meta {
            margin: 16px 0 20px;
            font-size: 0.95rem;
            color: #9fb3d3;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 16px;
            border-radius: 10px;
            border: 1px solid #4f6e99;
            color: #f8fafc;
            background: linear-gradient(180deg, #1f3d67 0%, #122540 100%);
            font-weight: 700;
        }
        .btn.primary {
            border-color: #22c55e;
            background: linear-gradient(180deg, #15803d 0%, #14532d 100%);
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Оплату успішно ініційовано</h1>
        <p>Дякуємо! Якщо платіж завершився успішно в LiqPay, ми скоро обробимо ваше замовлення.</p>
        <div id="payment-meta" class="meta"></div>
        <div class="actions">
            <a class="btn primary" href="/">Повернутися на головну</a>
            <a class="btn" href="/editor.html">Перейти в конструктор</a>
        </div>
    </main>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var status = params.get('status');
            var orderId = params.get('order_id');
            var amount = params.get('amount');
            var parts = [];
            var normalizedStatus = String(status || '').trim().toLowerCase();
            var failedStatuses = {
                failure: true,
                error: true,
                reversed: true,
                unsubscribed: true
            };

            if (orderId && !failedStatuses[normalizedStatus]) {
                try {
                    window.localStorage.removeItem('upf_cart_v1');
                    window.sessionStorage.removeItem('upf_pending_liqpay_order');
                    window.sessionStorage.removeItem('openCartOnHome');
                } catch (_) {}
            }

            if (orderId) parts.push('Замовлення: ' + orderId);
            if (status) parts.push('Статус: ' + status);
            if (amount) parts.push('Сума: ' + amount + ' UAH');

            var target = document.getElementById('payment-meta');
            target.textContent = parts.length
                ? parts.join(' • ')
                : 'Дані платежу будуть підтверджені після callback від LiqPay.';
        })();
    </script>
</body>
</html>
