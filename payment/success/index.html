<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплату отримано | Ukrainian Print Family</title>
    <style>
        :root {
            color-scheme: dark;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Manrope, Arial, sans-serif;
            background: radial-gradient(circle at 20% 15%, #1d4ed8 0%, #071126 42%, #04070f 100%);
            color: #e2e8f0;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .card {
            width: min(620px, 100%);
            border: 1px solid #36527e;
            border-radius: 20px;
            background: rgba(6, 15, 31, 0.88);
            box-shadow: 0 18px 46px rgba(2, 6, 23, 0.58);
            padding: 24px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 1.6rem;
        }
        p {
            margin: 0 0 14px;
            color: #c6d2e6;
            line-height: 1.45;
        }
        .meta {
            margin: 16px 0 16px;
            font-size: 0.95rem;
            color: #9fb3d3;
        }
        .sync {
            margin: 6px 0 20px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #3a567e;
            background: rgba(15, 28, 48, 0.55);
            color: #c8d8ee;
            font-size: 0.92rem;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 16px;
            border-radius: 10px;
            border: 1px solid #4f6e99;
            color: #f8fafc;
            background: linear-gradient(180deg, #1f3d67 0%, #122540 100%);
            font-weight: 700;
        }
        .btn.primary {
            border-color: #22c55e;
            background: linear-gradient(180deg, #15803d 0%, #14532d 100%);
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Оплату успішно ініційовано</h1>
        <p>Якщо платіж підтверджено в LiqPay, ми зафіксуємо замовлення і надішлемо всі дані адміну.</p>
        <div id="payment-meta" class="meta"></div>
        <div id="sync-status" class="sync">Перевіряємо оплату...</div>
        <div class="actions">
            <a class="btn primary" href="/">Повернутися на головну</a>
            <a class="btn" href="/editor.html">Перейти в конструктор</a>
        </div>
    </main>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var status = (params.get('status') || '').trim().toLowerCase();
            var orderId = (params.get('order_id') || '').trim();
            var amount = (params.get('amount') || '').trim();
            var parts = [];

            if (orderId) parts.push('Замовлення: ' + orderId);
            if (status) parts.push('Статус: ' + status);
            if (amount) parts.push('Сума: ' + amount + ' UAH');

            var metaTarget = document.getElementById('payment-meta');
            metaTarget.textContent = parts.length
                ? parts.join(' • ')
                : 'Дані платежу будуть підтверджені після callback від LiqPay.';

            var syncTarget = document.getElementById('sync-status');
            var paidStatuses = { success: true, sandbox: true };
            if (!paidStatuses[status]) {
                syncTarget.textContent = 'Очікуємо підтвердження оплати від LiqPay.';
                return;
            }

            var storageKey = 'upf_pending_liqpay_order';
            var doneKey = 'upf_paid_order_details_sent_' + orderId;
            if (window.sessionStorage.getItem(doneKey) === '1') {
                syncTarget.textContent = 'Дані замовлення вже надіслані адміну.';
                return;
            }

            var pendingRaw = window.sessionStorage.getItem(storageKey);
            if (!pendingRaw) {
                syncTarget.textContent = 'Платіж підтверджено. Дані замовлення не знайдено в сесії.';
                return;
            }

            var pending;
            try {
                pending = JSON.parse(pendingRaw);
            } catch (_) {
                syncTarget.textContent = 'Платіж підтверджено. Не вдалося прочитати дані замовлення.';
                return;
            }

            if (!pending || pending.orderId !== orderId) {
                syncTarget.textContent = 'Платіж підтверджено. Очікуємо актуальні дані замовлення.';
                return;
            }

            var notifyPayload = {
                orderId: orderId,
                name: pending.name || '',
                shipping: pending.shipping || '',
                phone: pending.phone || '',
                comment: pending.comment || '',
                items: Array.isArray(pending.items) ? pending.items : [],
                total: Number(pending.total || 0),
                paymentMethod: 'wallet'
            };

            fetch('/api/orders/notify-paid', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(notifyPayload)
            })
                .then(function (response) {
                    return response.json().catch(function () { return {}; }).then(function (data) {
                        return { ok: response.ok, data: data };
                    });
                })
                .then(function (result) {
                    if (!result.ok) {
                        var message = result.data && result.data.error ? result.data.error : 'Не вдалося синхронізувати замовлення.';
                        syncTarget.textContent = 'Платіж підтверджено. ' + message;
                        return;
                    }

                    syncTarget.textContent = 'Оплата підтверджена. Деталі замовлення та макети надіслані адміну.';
                    window.sessionStorage.setItem(doneKey, '1');
                    window.sessionStorage.removeItem(storageKey);
                    try {
                        window.localStorage.removeItem('upf_cart_v1');
                    } catch (_) {}
                })
                .catch(function () {
                    syncTarget.textContent = 'Платіж підтверджено. Не вдалося зв’язатися з сервером синхронізації.';
                });
        })();
    </script>
</body>
</html>
