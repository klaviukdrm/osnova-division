<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товар | Ukrainian Print Family</title>
    <meta name="description" content="Сторінка товару Ukrainian Print Family.">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="theme-color" content="#1d4ed8">
    <link id="canonical-link" rel="canonical" href="/">
        <link rel="icon" type="image/x-icon" href="/favicon-v2.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-v2-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-v2-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png">
    <link rel="manifest" href="/site-v2.webmanifest">
    <meta property="og:type" content="product">
    <meta property="og:locale" content="uk_UA">
    <meta property="og:title" content="Товар | Ukrainian Print Family">
    <meta property="og:description" content="Сторінка товару Ukrainian Print Family.">
    <meta property="og:image" content="/images/logosait.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Товар | Ukrainian Print Family">
    <meta name="twitter:description" content="Сторінка товару Ukrainian Print Family.">
    <meta name="twitter:image" content="/images/logosait.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="tail-container bg-white text-slate-900 overflow-x-hidden">
    <nav class="bg-white/95 border-b border-slate-200 sticky top-0 z-50 backdrop-blur">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between gap-4">
            <a href="/index.html#products" class="inline-flex items-center gap-2 liquid-glass-btn px-4 py-2 rounded-2xl bg-white border border-slate-200 text-slate-800">
                <i class="fa-solid fa-arrow-left"></i>
                До каталогу
            </a>
            <a href="/index.html" class="flex items-center gap-2 text-slate-900 font-semibold">
                <img src="/images/photo_2025-09-24_14-16-02.jpg" alt="Логотип" class="w-8 h-8 rounded-xl object-cover border border-slate-200">
                <span>Ukrainian Print Family</span>
            </a>
        </div>
    </nav>

    <main class="py-10 md:py-14">
        <section class="max-w-7xl mx-auto px-6">
            <div id="product-page-loading" class="text-center py-16 text-slate-500">
                Завантажуємо товар...
            </div>

            <div id="product-page-not-found" class="hidden max-w-2xl mx-auto rounded-3xl border border-slate-200 bg-white p-8 text-center">
                <h1 class="text-3xl font-bold section-title">Товар не знайдено</h1>
                <p class="text-slate-600 mt-3">Можливо, посилання застаріло або товар було видалено.</p>
                <a href="/index.html#products" class="inline-flex mt-6 liquid-glass-btn px-5 py-3 rounded-2xl bg-blue-700 text-white font-semibold">Перейти в каталог</a>
            </div>

            <article id="product-page-content" class="hidden grid lg:grid-cols-2 gap-10 items-start">
                <div class="rounded-3xl border border-slate-200 bg-slate-50 p-4 md:p-6">
                    <img id="product-image" src="" alt="Фото товару" class="w-full rounded-2xl object-cover bg-white">
                </div>

                <div class="space-y-5">
                    <p id="product-category" class="text-xs uppercase tracking-[0.25em] text-slate-400">Категорія</p>
                    <h1 id="product-title" class="text-3xl md:text-5xl font-bold section-title">Назва товару</h1>
                    <p id="product-price" class="text-3xl font-semibold text-emerald-600">0 грн</p>
                    <p id="product-description" class="text-lg text-slate-600 leading-relaxed" style="white-space: pre-line;">Опис товару.</p>
                    <div class="pt-2">
                        <a id="product-open-catalog" href="/index.html#products" class="inline-flex liquid-glass-btn px-6 py-3 rounded-2xl bg-blue-700 text-white font-semibold">
                            Відкрити каталог
                        </a>
                    </div>
                </div>
            </article>
        </section>
    </main>

    <script src="/js/catalog.js"></script>
    <script src="/js/product-page.js"></script>
</body>
</html>
